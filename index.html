<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Physics Playground</title>
    <meta
      name="description"
      content="Choose a physics simulation from a simple gallery."
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="gallery-page">
    <div class="page-shell gallery-shell">
      <header class="hero">
        <div class="hero-copy">
          <h1>Physics Playground</h1>
          <p class="lede">Pick a simulation to open.</p>
        </div>
      </header>

      <main>
        <section class="gallery-grid" aria-label="Simulation gallery">
          <button
            class="gallery-card"
            type="button"
            data-sim-target="sim/orbit.html"
          >
            <span class="gallery-card-title">Orbit Lab</span>
            <span class="gallery-card-desc"
              >Explore orbital motion around a star.</span
            >
          </button>
          <button
            class="gallery-card"
            type="button"
            data-sim-target="sim/pendulum.html"
          >
            <span class="gallery-card-title">Pendulum Lab</span>
            <span class="gallery-card-desc"
              >Test pendulum motion and oscillation.</span
            >
          </button>
          <button
            class="gallery-card"
            type="button"
            data-sim-target="sim/projectile.html"
          >
            <span class="gallery-card-title">Projectile Lab</span>
            <span class="gallery-card-desc"
              >Launch and trace a projectile path.</span
            >
          </button>
          <button
            class="gallery-card"
            type="button"
            data-sim-target="sim/circular.html"
          >
            <span class="gallery-card-title">Circular Motion</span>
            <span class="gallery-card-desc">Uniform circular motion demo.</span>
          </button>
          <button
            class="gallery-card"
            type="button"
            data-sim-target="sim/spring.html"
          >
            <span class="gallery-card-title">Spring Mass</span>
            <span class="gallery-card-desc">Mass on a spring (SHM).</span>
          </button>
          <button
            class="gallery-card"
            type="button"
            data-sim-target="sim/wave.html"
          >
            <span class="gallery-card-title">Wave Tank</span>
            <span class="gallery-card-desc">Traveling sine wave demo.</span>
          </button>
          <button
            class="gallery-card"
            type="button"
            data-sim-target="sim/bounce.html"
          >
            <span class="gallery-card-title">Bouncing Balls</span>
            <span class="gallery-card-desc">Multiple balls bouncing.</span>
          </button>
          <button
            class="gallery-card"
            type="button"
            data-sim-target="sim/collision.html"
          >
            <span class="gallery-card-title">Collision Lab</span>
            <span class="gallery-card-desc">Two-body elastic collision.</span>
          </button>
          <button
            class="gallery-card"
            type="button"
            data-sim-target="sim/diffusion.html"
          >
            <span class="gallery-card-title">Diffusion</span>
            <span class="gallery-card-desc">Random walkers spreading out.</span>
          </button>
          <button
            class="gallery-card"
            type="button"
            data-sim-target="sim/brownian.html"
          >
            <span class="gallery-card-title">Brownian Motion</span>
            <span class="gallery-card-desc"
              >Particle jitter from collisions.</span
            >
          </button>
          <button
            class="gallery-card"
            type="button"
            data-sim-target="sim/lissajous.html"
          >
            <span class="gallery-card-title">Lissajous</span>
            <span class="gallery-card-desc">Parametric Lissajous curves.</span>
          </button>

          <button
            class="gallery-card"
            type="button"
            data-sim-target="sim/electric.html"
          >
            <span class="gallery-card-title">Electric Field</span>
            <span class="gallery-card-desc"
              >Simple point-charge field lines.</span
            >
          </button>
        </section>
      </main>
    </div>

    <div class="loading-overlay" id="loading-overlay" aria-hidden="true">
      <div class="loading-card" role="status" aria-live="polite">
        <span class="loading-label">Loading...</span>
      </div>
    </div>

    <script src="gallery.js"></script>
  </body>
</html>
