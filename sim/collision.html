<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Collision Lab</title>
    <meta name="description" content="Two-body elastic collision with adjustable mass, velocity and elasticity." />
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body class="sim-page" data-sim="collision">
    <div class="page-shell">
      <header class="hero">
        <div class="hero-copy">
          <a class="back-link" href="../index.html">Back to gallery</a>
          <h1>Physics Playground</h1>
          <p class="lede">Two-body collision demo. Adjust mass, velocity and elasticity — balls bounce off walls.</p>
        </div>
      </header>

      <main class="app-grid">
        <section class="stage-card">
          <div class="stage-topbar">
            <h2 id="stage-title">Collision Lab</h2>
            <div class="stage-actions">
              <button class="ghost-button" id="pause-button" type="button">Pause</button>
              <button class="ghost-button" id="reset-button" type="button">Reset</button>
            </div>
          </div>
          <div class="canvas-wrap">
            <canvas id="simulation-canvas" aria-label="Physics simulation canvas"></canvas>
            <div class="canvas-overlay">
              <div class="overlay-chip" id="sim-hint">Elastic collision between two spheres.</div>
            </div>
          </div>
        </section>

        <aside class="control-card">
          <div class="global-controls">
            <label class="speed-control" for="simulation-speed">
              <span>Simulation speed</span>
              <div class="speed-row">
                <input id="simulation-speed" type="range" min="0.25" max="2" step="0.05" value="1" />
                <strong id="simulation-speed-value">1.00x</strong>
              </div>
            </label>
          </div>

          <div class="controls-stack">
            <div class="control-group-title">Ball A (blue)</div>

            <label class="control-panel active">
              <span>Mass A</span>
              <div class="speed-row">
                <input id="collision-mass-a" type="range" min="0.5" max="1000000" step="0.5" value="2" data-unit=" kg" />
                <span class="range-value" data-value-for="collision-mass-a">2 kg</span>
              </div>
            </label>

            <label class="control-panel active">
              <span>Initial velocity A</span>
              <div class="speed-row">
                <input id="collision-vel-a" type="range" min="-400" max="400" step="10" value="180" />
                <span class="range-value" data-value-for="collision-vel-a">180</span>
              </div>
            </label>

            <div class="control-group-title">Ball B (orange)</div>

            <label class="control-panel active">
              <span>Mass B</span>
              <div class="speed-row">
                <input id="collision-mass-b" type="range" min="0.5" max="1000000" step="0.5" value="3" data-unit=" kg" />
                <span class="range-value" data-value-for="collision-mass-b">3 kg</span>
              </div>
            </label>

            <label class="control-panel active">
              <span>Initial velocity B</span>
              <div class="speed-row">
                <input id="collision-vel-b" type="range" min="-400" max="400" step="10" value="-60" />
                <span class="range-value" data-value-for="collision-vel-b">-60</span>
              </div>
            </label>

            <div class="control-group-title">Collision</div>

            <label class="control-panel active">
              <span>Elasticity (0=inelastic, 1=elastic)</span>
              <div class="speed-row">
                <input id="collision-elasticity" type="range" min="0" max="1" step="0.05" value="1" />
                <span class="range-value" data-value-for="collision-elasticity">1</span>
              </div>
            </label>

            <label class="control-panel active" style="flex-direction: row; align-items: center; justify-content: space-between;">
              <span>Right Wall</span>
              <input id="collision-right-wall" type="checkbox" checked />
            </label>
          </div>
        </aside>
      </main>
    </div>
    <script src="../app.js"></script>
  </body>
</html>
