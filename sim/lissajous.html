<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lissajous Figures</title>
    <meta name="description" content="Parametric Lissajous curves with adjustable frequency ratios and phase." />
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body class="sim-page" data-sim="lissajous">
    <div class="page-shell">
      <header class="hero">
        <div class="hero-copy">
          <a class="back-link" href="../index.html">Back to gallery</a>
          <h1>Physics Playground</h1>
          <p class="lede">Parametric Lissajous figures — adjust frequency ratios and phase to explore the curve space.</p>
        </div>
      </header>

      <main class="app-grid">
        <section class="stage-card">
          <div class="stage-topbar">
            <h2 id="stage-title">Lissajous Figures</h2>
            <div class="stage-actions">
              <button class="ghost-button" id="pause-button" type="button">Pause</button>
              <button class="ghost-button" id="reset-button" type="button">Reset</button>
            </div>
          </div>
          <div class="canvas-wrap">
            <canvas id="simulation-canvas" aria-label="Physics simulation canvas"></canvas>
            <div class="canvas-overlay">
              <div class="overlay-chip" id="sim-hint">Beautiful parametric curves.</div>
            </div>
          </div>
        </section>

        <aside class="control-card">
          <div class="global-controls">
            <label class="speed-control" for="simulation-speed">
              <span>Simulation speed</span>
              <div class="speed-row">
                <input id="simulation-speed" type="range" min="0.25" max="2" step="0.05" value="1" />
                <strong id="simulation-speed-value">1.00x</strong>
              </div>
            </label>
          </div>

          <div class="controls-stack">
            <div class="control-group-title">Frequencies</div>

            <label class="control-panel active">
              <span>Frequency A</span>
              <div class="speed-row">
                <input id="lissajous-a" type="range" min="1" max="9" step="1" value="3" />
                <span class="range-value" data-value-for="lissajous-a">3</span>
              </div>
            </label>

            <label class="control-panel active">
              <span>Frequency B</span>
              <div class="speed-row">
                <input id="lissajous-b" type="range" min="1" max="9" step="1" value="2" />
                <span class="range-value" data-value-for="lissajous-b">2</span>
              </div>
            </label>

            <label class="control-panel active">
              <span>Phase δ (× π)</span>
              <div class="speed-row">
                <input id="lissajous-delta" type="range" min="0" max="2" step="0.05" value="0.5" />
                <span class="range-value" data-value-for="lissajous-delta">0.5</span>
              </div>
            </label>

            <div class="control-group-title">Shape</div>

            <label class="control-panel active">
              <span>Amplitude</span>
              <div class="speed-row">
                <input id="lissajous-amp" type="range" min="40" max="180" step="4" value="130" data-unit=" px" />
                <span class="range-value" data-value-for="lissajous-amp">130 px</span>
              </div>
            </label>
          </div>
        </aside>
      </main>
    </div>
    <script src="../app.js"></script>
  </body>
</html>
