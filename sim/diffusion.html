<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Diffusion</title>
    <meta name="description" content="Particle diffusion simulation with adjustable particle count and step size." />
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body class="sim-page" data-sim="diffusion">
    <div class="page-shell">
      <header class="hero">
        <div class="hero-copy">
          <a class="back-link" href="../index.html">Back to gallery</a>
          <h1>Physics Playground</h1>
          <p class="lede">Random walkers spreading from a central source — visualizing diffusion.</p>
        </div>
      </header>

      <main class="app-grid">
        <section class="stage-card">
          <div class="stage-topbar">
            <h2 id="stage-title">Diffusion</h2>
            <div class="stage-actions">
              <button class="ghost-button" id="pause-button" type="button">Pause</button>
              <button class="ghost-button" id="reset-button" type="button">Reset</button>
            </div>
          </div>
          <div class="canvas-wrap">
            <canvas id="simulation-canvas" aria-label="Physics simulation canvas"></canvas>
            <div class="canvas-overlay">
              <div class="overlay-chip" id="sim-hint">Many particles performing random walks.</div>
            </div>
          </div>
        </section>

        <aside class="control-card">
          <div class="global-controls">
            <label class="speed-control" for="simulation-speed">
              <span>Simulation speed</span>
              <div class="speed-row">
                <input id="simulation-speed" type="range" min="0.25" max="2" step="0.05" value="1" />
                <strong id="simulation-speed-value">1.00x</strong>
              </div>
            </label>
          </div>

          <div class="controls-stack">
            <div class="control-group-title">Particle Settings</div>

            <label class="control-panel active">
              <span>Particle count</span>
              <div class="speed-row">
                <input id="diffusion-count" type="range" min="20" max="600" step="10" value="200" />
                <span class="range-value" data-value-for="diffusion-count">200</span>
              </div>
            </label>

            <label class="control-panel active">
              <span>Step size (diffusion rate)</span>
              <div class="speed-row">
                <input id="diffusion-step" type="range" min="1" max="24" step="0.5" value="8" data-unit=" px" />
                <span class="range-value" data-value-for="diffusion-step">8 px</span>
              </div>
            </label>

            <label class="control-panel active">
              <span>Dot size</span>
              <div class="speed-row">
                <input id="diffusion-dot" type="range" min="1" max="8" step="0.5" value="3" data-unit=" px" />
                <span class="range-value" data-value-for="diffusion-dot">3 px</span>
              </div>
            </label>

            <div class="control-group-title">Appearance</div>

            <label class="control-panel active" style="gap:6px">
              <span>Color mode</span>
              <select id="diffusion-color" style="padding:6px 8px;border:1px solid var(--line);background:var(--panel);font:inherit;color:var(--text);">
                <option value="hue">Random hue</option>
                <option value="gradient">Distance gradient (blue→red)</option>
              </select>
            </label>
          </div>
        </aside>
      </main>
    </div>
    <script src="../app.js"></script>
  </body>
</html>
