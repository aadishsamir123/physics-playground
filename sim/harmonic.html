<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Harmonic Oscillator</title>
    <meta name="description" content="Superposition of harmonic oscillators with adjustable amplitudes and frequencies." />
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body class="sim-page" data-sim="harmonic">
    <div class="page-shell">
      <header class="hero">
        <div class="hero-copy">
          <a class="back-link" href="../index.html">Back to gallery</a>
          <h1>Physics Playground</h1>
          <p class="lede">Superposition of three harmonic oscillators — tune each component independently.</p>
        </div>
      </header>

      <main class="app-grid">
        <section class="stage-card">
          <div class="stage-topbar">
            <h2 id="stage-title">Harmonic Oscillator</h2>
            <div class="stage-actions">
              <button class="ghost-button" id="pause-button" type="button">Pause</button>
              <button class="ghost-button" id="reset-button" type="button">Reset</button>
            </div>
          </div>
          <div class="canvas-wrap">
            <canvas id="simulation-canvas" aria-label="Physics simulation canvas"></canvas>
            <div class="canvas-overlay">
              <div class="overlay-chip" id="sim-hint">Multiple oscillators combined.</div>
            </div>
          </div>
        </section>

        <aside class="control-card">
          <div class="global-controls">
            <label class="speed-control" for="simulation-speed">
              <span>Simulation speed</span>
              <div class="speed-row">
                <input id="simulation-speed" type="range" min="0.25" max="2" step="0.05" value="1" />
                <strong id="simulation-speed-value">1.00x</strong>
              </div>
            </label>
          </div>

          <div class="controls-stack">
            <div class="control-group-title" style="color:#ef4444">Component 1 (red)</div>

            <label class="control-panel active">
              <span>Amplitude 1</span>
              <div class="speed-row">
                <input id="harmonic-amp1" type="range" min="0" max="120" step="2" value="70" />
                <span class="range-value" data-value-for="harmonic-amp1">70</span>
              </div>
            </label>

            <label class="control-panel active">
              <span>Frequency 1</span>
              <div class="speed-row">
                <input id="harmonic-freq1" type="range" min="0.1" max="5" step="0.1" value="1" />
                <span class="range-value" data-value-for="harmonic-freq1">1</span>
              </div>
            </label>

            <div class="control-group-title" style="color:#3b82f6">Component 2 (blue)</div>

            <label class="control-panel active">
              <span>Amplitude 2</span>
              <div class="speed-row">
                <input id="harmonic-amp2" type="range" min="0" max="120" step="2" value="40" />
                <span class="range-value" data-value-for="harmonic-amp2">40</span>
              </div>
            </label>

            <label class="control-panel active">
              <span>Frequency 2</span>
              <div class="speed-row">
                <input id="harmonic-freq2" type="range" min="0.1" max="5" step="0.1" value="2" />
                <span class="range-value" data-value-for="harmonic-freq2">2</span>
              </div>
            </label>

            <div class="control-group-title" style="color:#10b981">Component 3 (green)</div>

            <label class="control-panel active">
              <span>Amplitude 3</span>
              <div class="speed-row">
                <input id="harmonic-amp3" type="range" min="0" max="120" step="2" value="22" />
                <span class="range-value" data-value-for="harmonic-amp3">22</span>
              </div>
            </label>

            <label class="control-panel active">
              <span>Frequency 3</span>
              <div class="speed-row">
                <input id="harmonic-freq3" type="range" min="0.1" max="5" step="0.1" value="3" />
                <span class="range-value" data-value-for="harmonic-freq3">3</span>
              </div>
            </label>

            <div class="control-group-title">Display</div>

            <label class="toggle-row">
              <input id="harmonic-show-components" type="checkbox" checked />
              <span>Show individual components</span>
            </label>
          </div>
        </aside>
      </main>
    </div>
    <script src="../app.js"></script>
  </body>
</html>
