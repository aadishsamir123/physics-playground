<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Electric Field</title>
    <meta name="description" content="Electric field with draggable charges, field lines and adjustable charge magnitudes." />
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body class="sim-page" data-sim="electric">
    <div class="page-shell">
      <header class="hero">
        <div class="hero-copy">
          <a class="back-link" href="../index.html">Back to gallery</a>
          <h1>Physics Playground</h1>
          <p class="lede">Drag point charges to reposition them. Adjust magnitudes and switch between field lines and arrows.</p>
        </div>
      </header>

      <main class="app-grid">
        <section class="stage-card">
          <div class="stage-topbar">
            <h2 id="stage-title">Electric Field</h2>
            <div class="stage-actions">
              <button class="ghost-button" id="pause-button" type="button">Pause</button>
              <button class="ghost-button" id="reset-button" type="button">Reset</button>
            </div>
          </div>
          <div class="canvas-wrap">
            <canvas id="simulation-canvas" aria-label="Physics simulation canvas"></canvas>
            <div class="canvas-overlay">
              <div class="overlay-chip" id="sim-hint">Drag charges to move them.</div>
            </div>
          </div>
        </section>

        <aside class="control-card">
          <div class="global-controls">
            <label class="speed-control" for="simulation-speed">
              <span>Simulation speed</span>
              <div class="speed-row">
                <input id="simulation-speed" type="range" min="0.25" max="2" step="0.05" value="1" />
                <strong id="simulation-speed-value">1.00x</strong>
              </div>
            </label>
          </div>

          <div class="controls-stack">
            <div class="control-group-title" style="color:#ef4444">Charge 1 (red = positive)</div>

            <label class="control-panel active">
              <span>Charge magnitude</span>
              <div class="speed-row">
                <input id="electric-charge1" type="range" min="-3" max="3" step="0.5" value="1" />
                <span class="range-value" data-value-for="electric-charge1">1</span>
              </div>
            </label>

            <div class="control-group-title" style="color:#2563eb">Charge 2 (blue = negative)</div>

            <label class="control-panel active">
              <span>Charge magnitude</span>
              <div class="speed-row">
                <input id="electric-charge2" type="range" min="-3" max="3" step="0.5" value="-1" />
                <span class="range-value" data-value-for="electric-charge2">-1</span>
              </div>
            </label>

            <div class="control-group-title">Display</div>

            <label class="toggle-row">
              <input id="electric-show-lines" type="checkbox" checked />
              <span>Field lines (uncheck for arrows)</span>
            </label>

            <label class="control-panel active">
              <span>Arrow grid resolution</span>
              <div class="speed-row">
                <input id="electric-resolution" type="range" min="20" max="80" step="4" value="40" data-unit=" px" />
                <span class="range-value" data-value-for="electric-resolution">40 px</span>
              </div>
            </label>
          </div>
        </aside>
      </main>
    </div>
    <script src="../app.js"></script>
  </body>
</html>
