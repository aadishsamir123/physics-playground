<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bouncing Balls</title>
    <meta name="description" content="Bouncing balls with elastic ball-to-ball collisions and adjustable gravity." />
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body class="sim-page" data-sim="bounce">
    <div class="page-shell">
      <header class="hero">
        <div class="hero-copy">
          <a class="back-link" href="../index.html">Back to gallery</a>
          <h1>Physics Playground</h1>
          <p class="lede">Elastic ball-to-ball collisions with full bounce physics. Adjust gravity and restitution.</p>
        </div>
      </header>

      <main class="app-grid">
        <section class="stage-card">
          <div class="stage-topbar">
            <h2 id="stage-title">Bouncing Balls</h2>
            <div class="stage-actions">
              <button class="ghost-button" id="pause-button" type="button">Pause</button>
              <button class="ghost-button" id="reset-button" type="button">Reset</button>
            </div>
          </div>
          <div class="canvas-wrap">
            <canvas id="simulation-canvas" aria-label="Physics simulation canvas"></canvas>
            <div class="canvas-overlay">
              <div class="overlay-chip" id="sim-hint">A crowd of bouncing balls.</div>
            </div>
          </div>
        </section>

        <aside class="control-card">
          <div class="global-controls">
            <label class="speed-control" for="simulation-speed">
              <span>Simulation speed</span>
              <div class="speed-row">
                <input id="simulation-speed" type="range" min="0.25" max="2" step="0.05" value="1" />
                <strong id="simulation-speed-value">1.00x</strong>
              </div>
            </label>
          </div>

          <div class="controls-stack">
            <div class="control-group-title">Ball Settings</div>

            <label class="control-panel active">
              <span>Ball count</span>
              <div class="speed-row">
                <input id="bounce-count" type="range" min="3" max="40" step="1" value="12" />
                <span class="range-value" data-value-for="bounce-count">12</span>
              </div>
            </label>

            <label class="control-panel active">
              <span>Min ball radius</span>
              <div class="speed-row">
                <input id="bounce-size" type="range" min="4" max="28" step="1" value="10" data-unit=" px" />
                <span class="range-value" data-value-for="bounce-size">10 px</span>
              </div>
            </label>

            <div class="control-group-title">Physics</div>

            <label class="control-panel active">
              <span>Gravity</span>
              <div class="speed-row">
                <input id="bounce-gravity" type="range" min="0" max="2000" step="50" value="900" />
                <span class="range-value" data-value-for="bounce-gravity">900</span>
              </div>
            </label>

            <label class="control-panel active">
              <span>Restitution (bounciness)</span>
              <div class="speed-row">
                <input id="bounce-restitution" type="range" min="0" max="1" step="0.02" value="0.78" />
                <span class="range-value" data-value-for="bounce-restitution">0.78</span>
              </div>
            </label>
          </div>
        </aside>
      </main>
    </div>
    <script src="../app.js"></script>
  </body>
</html>
