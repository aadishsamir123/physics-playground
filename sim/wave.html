<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wave Tank</title>
    <meta name="description" content="Traveling and standing wave simulation with adjustable amplitude and frequency." />
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body class="sim-page" data-sim="wave">
    <div class="page-shell">
      <header class="hero">
        <div class="hero-copy">
          <a class="back-link" href="../index.html">Back to gallery</a>
          <h1>Physics Playground</h1>
          <p class="lede">Traveling sine wave across the stage — toggle standing wave mode to see interference.</p>
        </div>
      </header>

      <main class="app-grid">
        <section class="stage-card">
          <div class="stage-topbar">
            <h2 id="stage-title">Wave Tank</h2>
            <div class="stage-actions">
              <button class="ghost-button" id="pause-button" type="button">Pause</button>
              <button class="ghost-button" id="reset-button" type="button">Reset</button>
            </div>
          </div>
          <div class="canvas-wrap">
            <canvas id="simulation-canvas" aria-label="Physics simulation canvas"></canvas>
            <div class="canvas-overlay">
              <div class="overlay-chip" id="sim-hint">Sine wave moving across the canvas.</div>
            </div>
          </div>
        </section>

        <aside class="control-card">
          <div class="global-controls">
            <label class="speed-control" for="simulation-speed">
              <span>Simulation speed</span>
              <div class="speed-row">
                <input id="simulation-speed" type="range" min="0.25" max="2" step="0.05" value="1" />
                <strong id="simulation-speed-value">1.00x</strong>
              </div>
            </label>
          </div>

          <div class="controls-stack">
            <div class="control-group-title">Wave Parameters</div>

            <label class="control-panel active">
              <span>Amplitude</span>
              <div class="speed-row">
                <input id="wave-amp" type="range" min="10" max="120" step="2" value="60" data-unit=" px" />
                <span class="range-value" data-value-for="wave-amp">60 px</span>
              </div>
            </label>

            <label class="control-panel active">
              <span>Frequency</span>
              <div class="speed-row">
                <input id="wave-freq" type="range" min="0.002" max="0.03" step="0.001" value="0.012" />
                <span class="range-value" data-value-for="wave-freq">0.012</span>
              </div>
            </label>

            <label class="control-panel active">
              <span>Wave speed</span>
              <div class="speed-row">
                <input id="wave-speed" type="range" min="0.3" max="8" step="0.1" value="2.4" />
                <span class="range-value" data-value-for="wave-speed">2.4</span>
              </div>
            </label>

            <div class="control-group-title">Mode</div>

            <label class="toggle-row">
              <input id="wave-standing" type="checkbox" />
              <span>Standing wave mode</span>
            </label>
          </div>
        </aside>
      </main>
    </div>
    <script src="../app.js"></script>
  </body>
</html>
