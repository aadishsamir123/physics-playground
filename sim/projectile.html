<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Projectile Lab</title>
    <meta name="description" content="Projectile Lab physics simulation." />
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body class="sim-page" data-sim="projectile">
    <div class="page-shell">
      <header class="hero">
        <div class="hero-copy">
          <a class="back-link" href="../index.html">Back to gallery</a>
          <h1>Physics Playground</h1>
          <p class="lede">
            Projectile Lab lets you tune launch angle, power, and air
            resistance.
          </p>
        </div>
      </header>

      <main class="app-grid">
        <section class="stage-card">
          <div class="stage-topbar">
            <h2 id="stage-title">Projectile Lab</h2>
            <div class="stage-actions">
              <button class="ghost-button" id="pause-button" type="button">
                Pause
              </button>
              <button class="ghost-button" id="reset-button" type="button">
                Reset
              </button>
            </div>
          </div>
          <div class="canvas-wrap">
            <canvas
              id="simulation-canvas"
              aria-label="Physics simulation canvas"
            ></canvas>
            <div class="canvas-overlay">
              <div class="overlay-chip" id="sim-hint">
                Launch a shell and trace the arc before it lands.
              </div>
            </div>
          </div>
        </section>

        <aside class="control-card">
          <div class="global-controls">
            <label class="speed-control" for="simulation-speed">
              <span>Simulation speed</span>
              <div class="speed-row">
                <input
                  id="simulation-speed"
                  type="range"
                  min="0.25"
                  max="2"
                  step="0.05"
                  value="1"
                />
                <strong id="simulation-speed-value">1.00x</strong>
              </div>
            </label>
          </div>

          <div class="controls-stack">
            <section class="control-panel active" data-panel="projectile">
              <h3>Projectile Lab</h3>
              <p>Launch a shell and trace the arc before it lands.</p>
              <label>
                Launch angle
                <input
                  id="projectile-angle"
                  type="range"
                  min="15"
                  max="78"
                  value="48"
                />
                <span class="range-value" data-value-for="projectile-angle"
                  >48°</span
                >
              </label>
              <label>
                Launch power
                <input
                  id="projectile-power"
                  type="range"
                  min="55"
                  max="180"
                  value="126"
                />
                <span class="range-value" data-value-for="projectile-power"
                  >126</span
                >
              </label>
              <label>
                Air resistance
                <input
                  id="projectile-drag"
                  type="range"
                  min="0"
                  max="30"
                  value="0"
                />
                <span class="range-value" data-value-for="projectile-drag"
                  >0</span
                >
              </label>
              <button class="primary-button" id="fire-projectile" type="button">
                Fire launch
              </button>
            </section>
          </div>
        </aside>
      </main>
    </div>

    <script src="../app.js"></script>
  </body>
</html>
