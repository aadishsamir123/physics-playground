<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Circular Motion</title>
    <meta name="description" content="Uniform circular motion with velocity and centripetal force vectors." />
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body class="sim-page" data-sim="circular">
    <div class="page-shell">
      <header class="hero">
        <div class="hero-copy">
          <a class="back-link" href="../index.html">Back to gallery</a>
          <h1>Physics Playground</h1>
          <p class="lede">Uniform circular motion with live velocity and centripetal acceleration vectors.</p>
        </div>
      </header>

      <main class="app-grid">
        <section class="stage-card">
          <div class="stage-topbar">
            <h2 id="stage-title">Circular Motion</h2>
            <div class="stage-actions">
              <button class="ghost-button" id="pause-button" type="button">Pause</button>
              <button class="ghost-button" id="reset-button" type="button">Reset</button>
            </div>
          </div>
          <div class="canvas-wrap">
            <canvas id="simulation-canvas" aria-label="Physics simulation canvas"></canvas>
            <div class="canvas-overlay">
              <div class="overlay-chip" id="sim-hint">A point moves in a circle.</div>
            </div>
          </div>
        </section>

        <aside class="control-card">
          <div class="global-controls">
            <label class="speed-control" for="simulation-speed">
              <span>Simulation speed</span>
              <div class="speed-row">
                <input id="simulation-speed" type="range" min="0.25" max="2" step="0.05" value="1" />
                <strong id="simulation-speed-value">1.00x</strong>
              </div>
            </label>
          </div>

          <div class="controls-stack">
            <div class="control-group-title">Motion Parameters</div>

            <label class="control-panel active">
              <span>Angular speed (ω)</span>
              <div class="speed-row">
                <input id="circular-speed" type="range" min="0.3" max="6" step="0.1" value="1.8" data-unit=" rad/s" />
                <span class="range-value" data-value-for="circular-speed">1.8 rad/s</span>
              </div>
            </label>

            <label class="control-panel active">
              <span>Radius</span>
              <div class="speed-row">
                <input id="circular-radius" type="range" min="40" max="200" step="4" value="120" data-unit=" px" />
                <span class="range-value" data-value-for="circular-radius">120 px</span>
              </div>
            </label>

            <div class="control-group-title">Display</div>

            <label class="toggle-row">
              <input id="circular-show-velocity" type="checkbox" checked />
              <span>Show velocity vector <span style="color:#16a34a;font-weight:700">v</span></span>
            </label>

            <label class="toggle-row">
              <input id="circular-show-centripetal" type="checkbox" checked />
              <span>Show centripetal vector <span style="color:#dc2626;font-weight:700">a</span></span>
            </label>
          </div>
        </aside>
      </main>
    </div>
    <script src="../app.js"></script>
  </body>
</html>
